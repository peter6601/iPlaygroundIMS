name: iPlaygroundIMS
options:
  bundleIdPrefix: com.peter6601
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ITSAppUsesNonExemptEncryption: NO
targets:
  IMS:
    type: application
    platform: iOS
    sources:
      - IMS
      - Shared
    dependencies:
      - target: IMSWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter6601.iplaygroundims
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: IMS/Info.plist
      properties:
        CFBundleDisplayName: IMS
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: IMS/IMS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.iplayground.ims
  IMSWidget:
    type: app-extension
    platform: iOS
    sources:
      - IMSWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter6601.iplaygroundims.widget
    info:
      path: IMSWidget/Info.plist
      properties:
        CFBundleDisplayName: IMS Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: IMSWidget/IMSWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.iplayground.ims
  IMSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IMSTests
        excludes:
          - "Fixtures/**"
      - path: IMSTests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter6601.iplaygroundims.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: IMS
